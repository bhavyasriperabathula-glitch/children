{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container" style="max-width: 500px;">
    <h1 style="text-align: center;"><i class="fas fa-user-shield"></i> Admin Login</h1>
    <p style="text-align: center;">Authorized access only.</p>

    <form action="{% url 'AdminLoginCheck' %}" method="POST" style="margin-top: 30px;">
        {% csrf_token %}

        <div class="form-group">
            <label>Admin ID</label>
            <input type="text" class="form-control" name="loginid" placeholder="Enter ID" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" name="pswd" placeholder="Enter password" required>
        </div>

        <div style="text-align: center; margin-top: 30px; display: flex; flex-direction: column; gap: 1rem;">
            <button type="submit" class="btn"><i class="fas fa-lock"></i> Secure Login</button>
            <button type="reset" class="btn" style="background: rgba(255,255,255,0.1);"><i class="fas fa-undo"></i> Reset</button>
        </div>

        {% if messages %}
            <div style="margin-top: 20px; text-align: center;">
                {% for message in messages %}
                    <p style="color: #ef4444; font-weight: 500;">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    </form>
</div>
{% endblock %}
