{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container" style="max-width: 500px;">
    <h1 style="text-align: center;">User Login</h1>
    <p style="text-align: center;">Secure access to your ADHD diagnosis dashboard.</p>

    <form action="{% url 'UserLoginCheck' %}" method="POST" style="margin-top: 30px;">
        {% csrf_token %}

        <div class="form-group">
            <label><i class="fas fa-id-badge"></i> Login ID</label>
            <input type="text" class="form-control" name="loginid" required placeholder="Enter your ID">
        </div>

        <div class="form-group">
            <label><i class="fas fa-key"></i> Password</label>
            <input type="password" class="form-control" name="pswd" required placeholder="Enter your password">
        </div>

        <div style="text-align: center; margin-top: 30px; display: flex; flex-direction: column; gap: 1rem;">
            <button type="submit" class="btn btn-success"><i class="fas fa-sign-in-alt"></i> Login</button>
            <button type="reset" class="btn" style="background: rgba(255,255,255,0.1);"><i class="fas fa-eraser"></i> Clear</button>
        </div>

        {% if messages %}
            <div style="margin-top: 20px; text-align: center;">
                {% for message in messages %}
                    <p style="color: #ef4444; font-weight: 500;">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    </form>
</div>
{% endblock %}
